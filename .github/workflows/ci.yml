
name: Java CI Pipeline

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Java Application
        run: |
          mkdir -p out
          javac -d out src/Calculator.java
          javac -cp out -d out test/CalculatorTest.java

      - name: Run Application
        run: java -cp out Calculator

      - name: Run Test Cases
        run: java -cp out CalculatorTest
